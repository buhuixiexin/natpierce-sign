name: 皎月连自动签到

on:
  schedule:
    # 每天 8:10 / 16:10 / 22:10 运行（北京时间）
    - cron: '10 2,10,16 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 执行签到
        env:
          NATPIERCE_USER: ${{ secrets.NATPIERCE_USER }}
          NATPIERCE_PASS: ${{ secrets.NATPIERCE_PASS }}
          MAIL_USER: ${{ secrets.NATPIERCE_MAIL_USER }}
          MAIL_PASS: ${{ secrets.NATPIERCE_MAIL_PASS }}
          MAIL_TO: ${{ secrets.NATPIERCE_MAIL_TO }}
          SCT_KEY: ${{ secrets.NATPIERCE_SCT_KEY }}
          TG_BOT_TOKEN: ${{ secrets.NATPIERCE_TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.NATPIERCE_TG_CHAT_ID }}
          BARK_KEY: ${{ secrets.NATPIERCE_BARK_KEY }}
        run: |
          python sign.py || echo "脚本执行完成（非零退出）"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sign-logs
          path: sign.log
          retention-days: 7
